name: '[CPU] mostlyai-engine Tests'

on:
  workflow_call:

env:
  PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
  FORCE_COLOR: '1'

jobs:
  run-tests-cpu-unit-sequential:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Setup | uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
          python-version: '3.11'

      - name: Setup | Dependencies
        run: |
          uv sync --frozen --only-group dev --only-group docs
          uv export --frozen --no-dev --no-default-groups --no-emit-project --no-hashes --no-emit-package torch --no-emit-package torchvision --no-emit-package torchaudio --output-file /tmp/runtime-constraints.txt
          uv pip install --constraint /tmp/runtime-constraints.txt --index-strategy unsafe-first-match torch==2.14.0+cpu torchvision==0.29.0+cpu torchaudio==2.11.0+cpu . --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Lint | Type Check (ty, non-blocking)
        run: uv run --no-sync ty check --exit-zero --output-format concise

      - name: Run | Tests -> unit
        run: uv run --no-sync pytest tests/unit

      - name: Build mkdocs
        run: uv run --no-sync mkdocs build --strict

      - name: Run tests -> end_to_end -> sequential
        run: uv run --no-sync pytest tests/end_to_end/test_tabular_sequential.py

      - name: Run tests -> end_to_end -> sequential context
        run: uv run --no-sync pytest tests/end_to_end/test_tabular_sequential_context.py

  run-tests-cpu-end-to-end-nonsequential:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Setup | uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
          python-version: '3.11'

      - name: Setup | Dependencies
        run: |
          uv sync --frozen --only-group dev
          uv export --frozen --no-dev --no-default-groups --no-emit-project --no-hashes --no-emit-package torch --no-emit-package torchvision --no-emit-package torchaudio --output-file /tmp/runtime-constraints.txt
          uv pip install --constraint /tmp/runtime-constraints.txt --index-strategy unsafe-first-match torch==2.14.0+cpu torchvision==0.29.0+cpu torchaudio==2.11.0+cpu . --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Run tests -> end_to_end all except sequential
        run: uv run --no-sync pytest --ignore=tests/end_to_end/test_tabular_sequential.py --ignore=tests/end_to_end/test_tabular_sequential_context.py tests/end_to_end/
