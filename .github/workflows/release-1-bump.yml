name: Release Step 1 - Release on GitHub
run-name: bump version to ${{ github.event_name == 'workflow_dispatch' && inputs.version || replace(github.ref_name, 'release/', '') }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version (e.g. 1.2.3)"
        required: true
        type: string
  push:
    tags:
      # release/2.7.2 -> 2.7.2. Plain version tags created below (2.7.1) do not match.
      - "release/*"

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      # Same string workflow_dispatch passes as inputs.version. Tag pushes use the suffix after release/.
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || replace(github.ref_name, 'release/', '') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update version
        run: |
          sed -i -E 's/^version = ".*"/version = "${{ env.RELEASE_VERSION }}"/' pyproject.toml
          sed -i -E 's/^__version__ = ".*"/__version__ = "${{ env.RELEASE_VERSION }}"/' mostlyai/engine/__init__.py

      - name: Commit and Push
        run: |
          BRANCH_NAME="release-${{ env.RELEASE_VERSION }}"
          git checkout -B $BRANCH_NAME
          git add pyproject.toml mostlyai/engine/__init__.py
          git commit -m "build: bump version to ${{ env.RELEASE_VERSION }}"
          git push -f origin $BRANCH_NAME

      - name: Create and Merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr_id=$(gh pr list --head release-${{ env.RELEASE_VERSION }} --base main --json number --jq '.[0].number')
          if [ -z "$pr_id" ]; then
            pr_id=$(gh pr create \
              --title "build: release ${{ env.RELEASE_VERSION }}" \
              --body "Release version ${{ env.RELEASE_VERSION }}." \
              --base main \
              --head release-${{ env.RELEASE_VERSION }})
          fi
          gh pr merge $pr_id --squash

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ env.RELEASE_VERSION }} \
            --title "Release ${{ env.RELEASE_VERSION }}" \
            --generate-notes
