name: Release Step 1 - Release on GitHub
run-name: bump version to ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version (e.g. 1.2.3)"
        required: true
        type: string
  push:
    tags:
      # release/2.7.2 -> 2.7.2. Plain version tags created below (2.7.1) do not match.
      - "release/*"

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            version="${GITHUB_REF_NAME#release/}"
          fi
          if [ -z "$version" ]; then
            echo "Release version is empty" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update version
        run: |
          sed -i -E 's/^version = ".*"/version = "${{ steps.version.outputs.version }}"/' pyproject.toml
          sed -i -E 's/^__version__ = ".*"/__version__ = "${{ steps.version.outputs.version }}"/' mostlyai/engine/__init__.py

      - name: Commit and Push
        run: |
          BRANCH_NAME="release-${{ steps.version.outputs.version }}"
          git checkout -B $BRANCH_NAME
          git add pyproject.toml mostlyai/engine/__init__.py
          git commit -m "build: bump version to ${{ steps.version.outputs.version }}"
          git push -f origin $BRANCH_NAME

      - name: Create and Merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr_id=$(gh pr list --head release-${{ steps.version.outputs.version }} --base main --json number --jq '.[0].number')
          if [ -z "$pr_id" ]; then
            pr_id=$(gh pr create \
              --title "build: release ${{ steps.version.outputs.version }}" \
              --body "Release version ${{ steps.version.outputs.version }}." \
              --base main \
              --head release-${{ steps.version.outputs.version }})
          fi
          gh pr merge $pr_id --squash

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ steps.version.outputs.version }} \
            --title "Release ${{ steps.version.outputs.version }}" \
            --generate-notes
