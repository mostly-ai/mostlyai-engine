[project]
name = "mostlyai-engine"
version = "2.6.0"
description = "Synthetic Data Engine"
authors = [{ name = "MOSTLY AI", email = "dev@mostly.ai" }]
requires-python = ">=3.11,<3.14"
readme = "README.md"
license = "Apache-2.0"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Telecommunications Industry",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

dependencies = [
    "setuptools>=77.0.3,<81.0.0",  # vllm 0.20 caps setuptools for Python > 3.11
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "pyarrow>=16.0.0",
    "joblib>=1.4.2",
    "scikit-learn>=1.4.0",
    "psutil>=5.9.5,<6",  # upgrade when colab psutil is updated
    "tokenizers>=0.21.1",  # vllm 0.20 lower bound
    "transformers>=5.5.1",  # vllm 0.20 forbids 5.0–5.4 and 5.5.0; >=5.5.1 needed for newer HF model types (e.g. gemma4)
    "datasets>=3.0.0",
    "accelerate>=1.5.0",
    "peft>=0.18.2",  # transformers 5.7+ checks min PEFT in model.add_adapter (integrations/peft.py)
    "huggingface-hub[hf-xet]>=0.30.2",
    "opacus>=1.5.4",
    "xgrammar>=0.1.32,<1.0.0",  # aligned with vllm 0.20
    "json-repair>=0.47.0",
    "torch>=2.11.0,<2.12.0",
    "torchaudio>=2.11.0,<2.12.0",
    "torchvision>=0.26.0,<0.27.0"
]

[project.optional-dependencies]
gpu = [
    "bitsandbytes==0.42.0; sys_platform == 'darwin'",
    "bitsandbytes>=0.45.5; sys_platform == 'linux'",
    "vllm==0.20.0; sys_platform == 'linux' or sys_platform == 'darwin'",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-rerunfailures>=15.0",
    "ruff>=0.11",  # sync'ed with .pre-commit-config
    "pre-commit>=4.0",
    "twine>=6.1",
    "ipykernel>=6.25",
]
docs = [
    "mkdocs>=1.6",
    "mkdocstrings[crystal, python]>=0.29",
    "mkdocs-material>=9.0",
    "mkdocs-llmstxt>=0.2",
    "griffe>=1.0",
    "pymdown-extensions>=10.0",
    "griffe-fieldz>=0.2",
    "black>=26.3.1",
]

[project.urls]
homepage = "https://github.com/mostly-ai/mostlyai-engine"
repository = "https://github.com/mostly-ai/mostlyai-engine"
documentation = "https://mostly-ai.github.io/mostlyai-engine/"

[tool.uv]
default-groups = ["dev", "docs"]
# Override vLLM 0.20.0 dependency metadata: use diskcache-weave (API-compatible fork)
# instead of vulnerable diskcache<=5.6.3 (CVE-2025-69872). Regenerate this block
# when bumping vllm (copy requires_dist from PyPI, then swap the diskcache entry).
dependency-metadata = [
    { name = "vllm", version = "0.20.0", requires-dist = [
        '''regex''',
        '''cachetools''',
        '''psutil''',
        '''sentencepiece''',
        '''numpy''',
        '''requests>=2.26.0''',
        '''tqdm''',
        '''blake3''',
        '''py-cpuinfo''',
        '''transformers!=5.0.*,!=5.1.*,!=5.2.*,!=5.3.*,!=5.4.*,!=5.5.0,>=4.56.0''',
        '''tokenizers>=0.21.1''',
        '''protobuf!=6.30.*,!=6.31.*,!=6.32.*,!=6.33.0.*,!=6.33.1.*,!=6.33.2.*,!=6.33.3.*,!=6.33.4.*,>=5.29.6''',
        '''fastapi[standard]>=0.115.0''',
        '''aiohttp>=3.13.3''',
        '''openai>=2.0.0''',
        '''pydantic>=2.12.0''',
        '''prometheus_client>=0.18.0''',
        '''pillow''',
        '''prometheus-fastapi-instrumentator>=7.0.0''',
        '''tiktoken>=0.6.0''',
        '''lm-format-enforcer==0.11.3''',
        '''llguidance<1.4.0,>=1.3.0; platform_machine == "x86_64" or platform_machine == "arm64" or platform_machine == "aarch64" or platform_machine == "ppc64le"''',
        '''outlines_core==0.2.14''',
        '''diskcache-weave>=5.6.3.post1,<7''',
        '''lark==1.2.2''',
        '''xgrammar<1.0.0,>=0.1.32; platform_machine == "x86_64" or platform_machine == "aarch64" or platform_machine == "arm64" or platform_machine == "s390x" or platform_machine == "ppc64le"''',
        '''typing_extensions>=4.10''',
        '''filelock>=3.16.1''',
        '''partial-json-parser''',
        '''pyzmq>=25.0.0''',
        '''msgspec''',
        '''gguf>=0.17.0''',
        '''mistral_common[image]>=1.11.0''',
        '''opencv-python-headless>=4.13.0''',
        '''pyyaml''',
        '''six>=1.16.0; python_version > "3.11"''',
        '''setuptools<81.0.0,>=77.0.3; python_version > "3.11"''',
        '''einops''',
        '''compressed-tensors==0.15.0.1''',
        '''depyf==0.20.0''',
        '''cloudpickle''',
        '''watchfiles''',
        '''python-json-logger''',
        '''ninja''',
        '''pybase64''',
        '''cbor2''',
        '''ijson''',
        '''setproctitle''',
        '''openai-harmony>=0.0.3''',
        '''anthropic>=0.71.0''',
        '''model-hosting-container-standards<1.0.0,>=0.1.13''',
        '''mcp''',
        '''opentelemetry-sdk>=1.27.0''',
        '''opentelemetry-api>=1.27.0''',
        '''opentelemetry-exporter-otlp>=1.27.0''',
        '''opentelemetry-semantic-conventions-ai>=0.4.1''',
        '''numba==0.65.0''',
        '''torch==2.11.0''',
        '''torchaudio==2.11.0''',
        '''torchvision==0.26.0''',
        '''flashinfer-python==0.6.8.post1''',
        '''flashinfer-cubin==0.6.8.post1''',
        '''apache-tvm-ffi==0.1.9''',
        '''tilelang==0.1.9''',
        '''nvidia-cudnn-frontend<1.19.0,>=1.13.0''',
        '''fastsafetensors>=0.2.2''',
        '''nvidia-cutlass-dsl>=4.4.2''',
        '''quack-kernels>=0.3.3''',
        '''zentorch-weekly==5.2.1.dev20260408; extra == "zen"''',
        '''pandas; extra == "bench"''',
        '''matplotlib; extra == "bench"''',
        '''seaborn; extra == "bench"''',
        '''datasets; extra == "bench"''',
        '''scipy; extra == "bench"''',
        '''plotly; extra == "bench"''',
        '''tensorizer==2.10.1; extra == "tensorizer"''',
        '''fastsafetensors>=0.2.2; extra == "fastsafetensors"''',
        '''instanttensor>=0.1.5; extra == "instanttensor"''',
        '''runai-model-streamer[azure,gcs,s3]>=0.15.7; extra == "runai"''',
        '''av; extra == "audio"''',
        '''scipy; extra == "audio"''',
        '''soundfile; extra == "audio"''',
        '''mistral_common[audio]; extra == "audio"''',
        '''helion==1.0.0; extra == "helion"''',
        '''smg-grpc-servicer[vllm]>=0.5.2; extra == "grpc"''',
        '''opentelemetry-sdk>=1.26.0; extra == "otel"''',
        '''opentelemetry-api>=1.26.0; extra == "otel"''',
        '''opentelemetry-exporter-otlp>=1.26.0; extra == "otel"''',
        '''opentelemetry-semantic-conventions-ai>=0.4.1; extra == "otel"'''
    ]},
]

[tool.hatch.build.targets.sdist]
include = ["mostlyai/engine"]

[tool.hatch.build.targets.wheel]
include = ["mostlyai/engine"]

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["*.ipynb"]
[tool.ruff.format]
exclude = ["examples/*.ipynb"]
[tool.ruff.lint]
extend-select = ["I"]
